<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" class="mansion-scene" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06050f"/>
      <stop offset="0.55" stop-color="#1d1230"/>
      <stop offset="1" stop-color="#3a2244"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#f5e7c2" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#c9b6e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1d1230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="bat">
      <path d="M0 0 C-6 -6 -14 -6 -22 -2 C-16 -2 -12 2 -10 6 C-7 2 -3 2 0 4 C3 2 7 2 10 6 C12 2 16 -2 22 -2 C14 -6 6 -6 0 0 Z" fill="#05040a"/>
    </g>
  </defs>

  <!-- sky, stars, moon -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#f3ead6">
    <circle class="star s1" cx="90" cy="70" r="1.6"/><circle class="star s2" cx="210" cy="150" r="1.2"/>
    <circle class="star s3" cx="330" cy="60" r="1.8"/><circle class="star s4" cx="460" cy="120" r="1.1"/>
    <circle class="star s2" cx="560" cy="40" r="1.5"/><circle class="star s1" cx="680" cy="170" r="1.2"/>
    <circle class="star s3" cx="760" cy="80" r="1.4"/><circle class="star s4" cx="900" cy="50" r="1.7"/>
    <circle class="star s1" cx="980" cy="140" r="1.1"/><circle class="star s2" cx="1440" cy="90" r="1.6"/>
    <circle class="star s3" cx="1530" cy="200" r="1.2"/><circle class="star s4" cx="1380" cy="330" r="1.1"/>
    <circle class="star s1" cx="150" cy="260" r="1.3"/><circle class="star s2" cx="400" cy="250" r="1.0"/>
    <circle class="star s3" cx="1500" cy="40" r="1.4"/><circle class="star s4" cx="40" cy="190" r="1.2"/>
    <circle class="star s1" cx="620" cy="260" r="1.0"/><circle class="star s2" cx="1080" cy="40" r="1.3"/>
  </g>
  <circle cx="1220" cy="210" r="260" fill="url(#moonGlow)"/>
  <circle cx="1220" cy="210" r="92" fill="#f2e4bf"/>
  <circle cx="1190" cy="185" r="16" fill="#e2d1a6"/><circle cx="1250" cy="240" r="22" fill="#e2d1a6"/>
  <circle cx="1240" cy="170" r="9" fill="#e2d1a6"/>

  <!-- drifting clouds -->
  <g class="clouds" fill="#140c22" opacity="0.85">
    <ellipse cx="1100" cy="230" rx="170" ry="26"/><ellipse cx="1180" cy="210" rx="110" ry="22"/>
    <ellipse cx="300" cy="140" rx="200" ry="24"/><ellipse cx="380" cy="122" rx="120" ry="20"/>
  </g>

  <!-- bats -->
  <g class="bats">
    <use href="#bat" class="bat b1" x="0" y="0"/>
    <use href="#bat" class="bat b2" x="0" y="0"/>
    <use href="#bat" class="bat b3" x="0" y="0"/>
  </g>

  <!-- far hills -->
  <path d="M0 640 C200 590 360 610 520 600 C700 590 900 560 1080 590 C1260 615 1420 580 1600 600 L1600 900 L0 900 Z" fill="#120c1c"/>

  <!-- the mansion -->
  <g fill="#08060e">
    <!-- side wings -->
    <rect x="360" y="520" width="220" height="230"/>
    <polygon points="350,522 470,450 590,522"/>
    <rect x="1020" y="520" width="220" height="230"/>
    <polygon points="1010,522 1130,450 1250,522"/>
    <!-- main body and roof -->
    <rect x="560" y="420" width="480" height="330"/>
    <polygon points="540,424 800,300 1060,424"/>
    <!-- towers -->
    <rect x="500" y="360" width="100" height="390"/>
    <polygon points="488,364 550,250 612,364"/>
    <rect x="1000" y="360" width="100" height="390"/>
    <polygon points="988,364 1050,250 1112,364"/>
    <rect x="745" y="250" width="110" height="200"/>
    <polygon points="732,254 800,120 868,254"/>
    <!-- chimneys and spire -->
    <rect x="640" y="330" width="26" height="70"/><rect x="930" y="320" width="26" height="80"/>
    <rect x="798" y="92" width="4" height="32"/>
    <rect x="547" y="226" width="6" height="26"/><rect x="1047" y="226" width="6" height="26"/>
  </g>

  <!-- window glow halos -->
  <g filter="url(#softBlur)">
    <circle class="halo w1" cx="800" cy="330" r="40" fill="url(#windowGlow)"/>
    <circle class="halo w2" cx="550" cy="430" r="36" fill="url(#windowGlow)"/>
    <circle class="halo w3" cx="700" cy="520" r="40" fill="url(#windowGlow)"/>
    <circle class="halo w1" cx="1130" cy="600" r="36" fill="url(#windowGlow)"/>
  </g>

  <!-- windows (lit ones flicker) -->
  <g>
    <rect class="win w1" x="782" y="300" width="36" height="56" rx="18"/>
    <rect class="win w2" x="532" y="400" width="36" height="56" rx="18"/>
    <rect class="win dark" x="1032" y="400" width="36" height="56" rx="18"/>
    <rect class="win dark" x="532" y="520" width="36" height="56" rx="18"/>
    <rect class="win w3" x="1032" y="520" width="36" height="56" rx="18"/>
    <rect class="win w3" x="680" y="490" width="40" height="64"/>
    <rect class="win dark" x="880" y="490" width="40" height="64"/>
    <rect class="win dark" x="620" y="600" width="40" height="64"/>
    <rect class="win w2" x="940" y="600" width="40" height="64"/>
    <rect class="win dark" x="410" y="580" width="36" height="54"/>
    <rect class="win dark" x="494" y="580" width="36" height="54"/>
    <rect class="win w1" x="1112" y="580" width="36" height="54"/>
    <rect class="win dark" x="1190" y="580" width="36" height="54"/>
    <!-- the front door -->
    <path d="M760 750 L760 640 Q800 600 840 640 L840 750 Z" fill="#1a0f0a"/>
    <path class="win w2" d="M776 750 L776 646 Q800 622 824 646 L824 750 Z" opacity="0.25"/>
  </g>

  <!-- dead trees -->
  <g stroke="#05040a" stroke-linecap="round" fill="none">
    <path d="M150 790 C160 700 150 640 170 560" stroke-width="22"/>
    <path d="M165 640 C120 600 90 590 60 560" stroke-width="10"/>
    <path d="M168 600 C210 560 240 540 270 500" stroke-width="9"/>
    <path d="M110 590 C100 560 80 540 70 520" stroke-width="5"/>
    <path d="M240 530 C250 505 270 490 290 470" stroke-width="5"/>
    <path d="M170 560 C175 520 190 500 200 470" stroke-width="7"/>
    <path d="M1450 800 C1440 710 1460 650 1440 580" stroke-width="20"/>
    <path d="M1445 660 C1490 620 1520 610 1550 580" stroke-width="9"/>
    <path d="M1442 620 C1400 580 1380 560 1350 530" stroke-width="8"/>
    <path d="M1520 600 C1530 575 1545 560 1560 540" stroke-width="5"/>
    <path d="M1440 580 C1435 545 1420 520 1410 495" stroke-width="6"/>
  </g>

  <!-- ground and iron fence -->
  <path d="M0 760 C300 740 600 755 800 750 C1000 745 1300 735 1600 755 L1600 900 L0 900 Z" fill="#040308"/>
  <g fill="#030206">
    <rect x="0" y="790" width="1600" height="6"/>
    <rect x="0" y="840" width="1600" height="5"/>
    <g id="fence">
      <rect x="20" y="770" width="6" height="90"/><polygon points="17,772 23,754 29,772"/>
      <rect x="70" y="770" width="6" height="90"/><polygon points="67,772 73,754 79,772"/>
      <rect x="120" y="770" width="6" height="90"/><polygon points="117,772 123,754 129,772"/>
      <rect x="170" y="770" width="6" height="90"/><polygon points="167,772 173,754 179,772"/>
      <rect x="220" y="770" width="6" height="90"/><polygon points="217,772 223,754 229,772"/>
      <rect x="270" y="770" width="6" height="90"/><polygon points="267,772 273,754 279,772"/>
      <rect x="320" y="770" width="6" height="90"/><polygon points="317,772 323,754 329,772"/>
      <rect x="370" y="770" width="6" height="90"/><polygon points="367,772 373,754 379,772"/>
    </g>
    <use href="#fence" x="400"/><use href="#fence" x="800"/><use href="#fence" x="1200"/>
  </g>

  <!-- fog -->
  <g filter="url(#blur)" fill="#8e7fa8">
    <g class="fog f1" opacity="0.22">
      <ellipse cx="200" cy="800" rx="380" ry="60"/><ellipse cx="900" cy="830" rx="480" ry="70"/>
      <ellipse cx="1500" cy="810" rx="360" ry="60"/><ellipse cx="2100" cy="820" rx="380" ry="60"/>
    </g>
    <g class="fog f2" opacity="0.16">
      <ellipse cx="500" cy="760" rx="420" ry="50"/><ellipse cx="1300" cy="770" rx="420" ry="55"/>
      <ellipse cx="2000" cy="760" rx="420" ry="50"/>
    </g>
  </g>

  <!-- lightning flash (also triggered for the murder) -->
  <rect class="lightning" width="1600" height="900" fill="#e8e4ff"/>
</svg>

# Render Blueprint: tells Render how to run this app. See README.md "Put it online".
services:
  - type: web
    name: mystery-night
    runtime: python
    region: oregon        # same region as the Supabase database (us-west-2), so it stays fast
    plan: starter         # ~$7 USD/month, always awake. Change to "free" to save money (sleeps when idle).
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server.app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false       # Render asks you to paste this in its dashboard; it never goes in GitHub
